<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>English Flashcards Pro</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,500;0,600;0,700;0,800;1,500;1,700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <h2>Flashcards Pro</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-view="dashboard"><i class="fa-solid fa-house"></i><span>Trang chủ</span></button>
                <button class="nav-item" data-view="study"><i class="fa-solid fa-book-open"></i><span>Học tập</span></button>
                <button class="nav-item" data-view="library"><i class="fa-solid fa-swatchbook"></i><span>Thư viện</span></button>
                <button class="nav-item" data-view="settings"><i class="fa-solid fa-gear"></i><span>Cài đặt</span></button>
            </nav>
            <div class="sidebar-footer">
                <button id="themeToggle" class="btn-theme-toggle">
                    <i class="fa-solid fa-moon"></i> <span>Đổi giao diện</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1 id="viewTitle">Trang chủ</h1>
            </header>

            <section id="dashboardView" class="view-section active">
                <div class="stats-grid">
                    <div class="stat-card squircle">
                        <i class="fa-solid fa-check-double color-success"></i>
                        <div class="stat-info">
                            <h3 id="statMastered">0 Từ</h3>
                            <p>Đã thuộc</p>
                        </div>
                    </div>
                    <div class="stat-card squircle">
                        <i class="fa-solid fa-chart-line color-primary"></i>
                        <div class="stat-info">
                            <h3 id="statProgress">0%</h3>
                            <p>Hoàn thành</p>
                        </div>
                    </div>
                </div>

                <h2 class="section-subtitle">Danh sách bài học</h2>
                <ul class="deck-list" id="deckList"></ul>
            </section>

            <section id="studyView" class="view-section">
                <div class="study-container">
                    <div class="card-status">
                        <span id="cardPos">0 / 0</span>
                    </div>

                    <div class="flashcard-wrapper">
                        <div class="flashcard" id="flashcard">
                            <div class="card-face card-front squircle">
                                <h2 id="cardWord">Word</h2>
                                <p id="cardIpa" class="ipa-text">/ipa/</p>
                                <span class="hint-text">Chạm để xem nghĩa</span>
                            </div>
                            
                            <div class="card-face card-back squircle">
                                <h3 id="cardMeaning">Nghĩa tiếng Việt</h3>
                                <div class="example-box">
                                    <p id="cardExample" class="example-en">Ví dụ tiếng Anh</p>
                                    <p id="cardExampleVi" class="example-vi">Nghĩa của ví dụ</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="study-controls">
                        <button id="prevBtn" class="control-btn" title="Từ trước"><i class="fa-solid fa-arrow-left"></i></button>
                        
                        <button id="speakBtn" class="control-btn primary" title="Phát âm"><i class="fa-solid fa-volume-high"></i></button>
                        
                        <button id="notMasteredBtn" class="control-btn danger" title="Chưa thuộc"><i class="fa-solid fa-xmark"></i></button>
                        
                        <button id="masterBtn" class="control-btn success" title="Đã thuộc"><i class="fa-solid fa-check"></i></button>
                        
                        <button id="nextBtn" class="control-btn" title="Từ tiếp theo"><i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>
            </section>

            <section id="libraryView" class="view-section">
                <div class="search-box squircle">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Tìm chủ đề bài học...">
                </div>
                <ul class="deck-list" id="mobileDeckList"></ul>
            </section>

            <section id="settingsView" class="view-section">
                <div class="settings-card squircle">
                    <h3>Cài đặt ứng dụng</h3>
                    <p style="color: var(--text-muted); margin-bottom: 20px;">Tùy chỉnh trải nghiệm học tập của bạn.</p>
                    <hr>
                    <button id="resetStatsBtn" class="btn-danger-outline" style="margin-top: 20px;">
                        <i class="fa-solid fa-trash-can"></i> Xóa toàn bộ tiến độ
                    </button>
                </div>
            </section>
        </main>

        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-item active" data-view="dashboard"><i class="fa-solid fa-house"></i><span>Home</span></button>
            <button class="nav-item" data-view="study"><i class="fa-solid fa-book-open"></i><span>Học</span></button>
            <button class="nav-item" data-view="library"><i class="fa-solid fa-magnifying-glass"></i><span>Tìm</span></button>
            <button class="nav-item" data-view="settings"><i class="fa-solid fa-gear"></i><span>Cài đặt</span></button>
        </nav>
    </div>

    <script src="group_1.js"></script>
    <script src="group_2.js"></script>
    <script src="group_3.js"></script>
    <script src="group_4.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
