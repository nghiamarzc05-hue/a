<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flashcards Pro</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <h2>Flashcards Pro</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-view="dashboard"><i class="fa-solid fa-house"></i><span>Trang chủ</span></button>
                <button class="nav-item" data-view="study"><i class="fa-solid fa-book-open"></i><span>Học</span></button>
                <button class="nav-item" data-view="library"><i class="fa-solid fa-magnifying-glass"></i><span>Tìm kiếm</span></button>
                <button class="nav-item" data-view="settings"><i class="fa-solid fa-gear"></i><span>Cài đặt</span></button>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h1 id="viewTitle">Trang chủ</h1>
            </header>

            <section id="dashboardView" class="view-section active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <i class="fa-solid fa-check-circle"></i>
                        <div class="stat-info">
                            <p>Đã thuộc</p>
                            <h3 id="statMastered">0</h3>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fa-solid fa-fire"></i>
                        <div class="stat-info">
                            <p>Tiến độ</p>
                            <h3 id="statProgress">0%</h3>
                        </div>
                    </div>
                </div>
                <h3 style="margin-bottom: 15px;">Danh sách bộ thẻ</h3>
                <ul class="deck-list" id="deckList"></ul>
            </section>

            <section id="studyView" class="view-section">
                <div class="study-container">
                    <div class="flashcard-wrapper">
                        <div id="flashcard" class="flashcard">
                            <div class="card-face card-front">
                                <div class="card-content-scroll">
                                    <div class="card-status" id="cardCounter">0 / 0</div>
                                    <h2 id="cardWord">Word</h2>
                                    <div class="ipa-text" id="cardIpa">/ipa/</div>
                                    <div class="hint-text">Chạm để lật</div>
                                </div>
                            </div>
                            <div class="card-face card-back">
                                <div class="card-content-scroll">
                                    <div class="card-pos-tag" id="cardPos">Từ loại</div>
                                    <h3 id="cardMeaning">Nghĩa tiếng Việt</h3>
                                    <div class="example-box">
                                        <div class="example-en" id="cardExampleEn">English Example</div>
                                        <div class="example-vi" id="cardExampleVi">Nghĩa tiếng Việt ví dụ</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="study-controls">
                        <button id="prevBtn" class="control-btn"><i class="fa-solid fa-chevron-left"></i></button>
                        <button id="notMasteredBtn" class="control-btn"><i class="fa-solid fa-xmark"></i></button>
                        <button id="speakBtn" class="control-btn speak-btn"><i class="fa-solid fa-volume-high"></i></button>
                        <button id="masterBtn" class="control-btn"><i class="fa-solid fa-check"></i></button>
                        <button id="nextBtn" class="control-btn"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
            </section>

            <section id="libraryView" class="view-section">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Tìm kiếm từ khóa...">
                </div>
                <ul class="deck-list" id="libraryList"></ul>
            </section>

            <section id="settingsView" class="view-section">
                <div class="settings-card stat-card" style="flex-direction: column; align-items: stretch; gap: 0;">
                    <h3 style="margin-bottom: 5px;">Cài đặt ứng dụng</h3>
                    <p style="color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem;">Tùy chỉnh trải nghiệm học tập.</p>
                    
                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin-bottom: 25px;">
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                        <span style="font-weight: 600; font-size: 1.1rem; color: var(--text-main);">
                            <i class="fa-solid fa-moon" style="margin-right: 12px; color: var(--primary);"></i> Chế độ Tối
                        </span>
                        <label class="theme-switch">
                            <input type="checkbox" id="themeSwitch">
                            <span class="slider round"></span>
                        </label>
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin-bottom: 25px;">

                    <button id="resetStatsBtn" class="btn-danger-outline" style="width: 100%; padding: 14px; border-radius: 14px; border: 2px solid var(--danger); background: transparent; color: var(--danger); font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: 0.3s;">
                        <i class="fa-solid fa-trash-can" style="margin-right: 8px;"></i> Xóa toàn bộ tiến độ
                    </button>
                </div>
            </section>
        </main>

        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-item active" data-view="dashboard"><i class="fa-solid fa-house"></i><span>Trang chủ</span></button>
            <button class="nav-item" data-view="study"><i class="fa-solid fa-book-open"></i><span>Học</span></button>
            <button class="nav-item" data-view="library"><i class="fa-solid fa-magnifying-glass"></i><span>Tìm</span></button>
            <button class="nav-item" data-view="settings"><i class="fa-solid fa-gear"></i><span>Cài đặt</span></button>
        </nav>
    </div>

    <script src="group_1.js"></script>
    <script src="group_2.js"></script>
    <script src="group_3.js"></script>
    <script src="group_4.js"></script>
    <script src="group_5.js"></script>
    <script src="group_6.js"></script>
    <script src="group_7.js"></script>
    <script src="group_8.js"></script>
    <script src="group_9.js"></script>
    <script src="group_10.js"></script>
    <script src="group_11.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
